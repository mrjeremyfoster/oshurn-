<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oshurn Goals | Financial Workspace</title><link rel="icon" href="oshurn-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="tools.css"></head><body class="app-shell"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="oshurn-logo.svg" alt="Oshurn"></a><nav class="desktop-nav"><a href="app.html">Workspace</a><a href="tools.html">Tools</a><a href="health.html">Financial Health</a></nav></div></header><main class="tool-page"><div class="container"><div class="tool-page-head"><small>OSHURN GOALS</small><h1>Turn intentions into progress.</h1><p>Create simple financial goals and see how close you are to each target. Your entries stay in this browser prototype.</p></div><section class="tool-lab"><div class="tool-lab-copy"><span>NEW GOAL</span><h2>Set a target.</h2><label>Goal name<input id="goal-name" placeholder="Emergency fund"></label><label>Current amount<input id="goal-current" type="number" placeholder="2500"></label><label>Target amount<input id="goal-target" type="number" placeholder="10000"></label><button class="btn btn-primary" id="add-goal">Add goal</button></div><div class="tool-result"><small>YOUR GOALS</small><div id="goal-list"><p style="color:#91a6b5;font-size:12px">No goals yet. Add your first goal.</p></div></div></section></div></main><script>const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);let goals=JSON.parse(localStorage.getItem('oshurnGoals')||'[]');function render(){const box=$('goal-list');if(!goals.length){box.innerHTML='<p style="color:#91a6b5;font-size:12px">No goals yet. Add your first goal.</p>';return}box.innerHTML=goals.map((g,i)=>{let pct=Math.max(0,Math.min(100,g.target?g.current/g.target*100:0));return `<div style="margin:0 0 22px"><div style="display:flex;justify-content:space-between;gap:12px"><strong style="font-size:18px">${g.name}</strong><button onclick="removeGoal(${i})" style="background:none;border:0;color:#718898;cursor:pointer">×</button></div><div style="display:flex;justify-content:space-between;color:#91a6b5;font-size:10px;margin:7px 0"><span>${money(g.current)} saved</span><span>${money(g.target)} target</span></div><div class="result-line"><i style="width:${pct}%"></i></div><small style="display:block;color:#72c3ff;margin-top:6px">${Math.round(pct)}% complete</small></div>`}).join('')}function removeGoal(i){goals.splice(i,1);localStorage.setItem('oshurnGoals',JSON.stringify(goals));render()}$('add-goal').onclick=()=>{let name=$('goal-name').value.trim(),current=Number($('goal-current').value)||0,target=Number($('goal-target').value)||0;if(!name||target<=0)return;goals.push({name,current,target});localStorage.setItem('oshurnGoals',JSON.stringify(goals));$('goal-name').value='';$('goal-current').value='';$('goal-target').value='';render()};render();</script></body></html>
